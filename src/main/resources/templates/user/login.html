<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login | Portfolio Mall</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="site-header">
    <a class="brand" href="/items">Portfolio Mall</a>
    <p class="subtitle">User Info Page</p>
    <nav class="nav">
        <a href="/items">상품</a>
        <a href="/search">검색</a>
        <a href="/user/basket">장바구니</a>
        <a href="/user/orders">내 주문</a>
        <a href="/user/profile">내 정보</a>
        <a href="/user/login">유저 로그인</a>
    </nav>
    <nav class="nav nav-secondary">
        <a href="/seller/items">판매자 상품</a>
        <a href="/seller/orders">판매자 주문</a>
        <a href="/seller/profile">판매자 정보</a>
        <a href="/seller/login">판매자 로그인</a>
    </nav>
</header>
<main class="container">
    <h1>유저 로그인</h1>
    <section class="card">
        <form class="form" id="userLoginForm">
            <label><span>아이디</span><input type="text" name="id" placeholder="아이디" autocomplete="username"></label>
            <label><span>비밀번호</span><input type="password" name="password" placeholder="비밀번호" autocomplete="current-password"></label>
            <button type="submit">로그인</button>
        </form>
        <div class="links">
            <a href="/user/sign-up">회원가입</a>
            <a href="/user/find-id">아이디 찾기</a>
            <a href="/user/reset-pw">비밀번호 재설정</a>
        </div>
        <p class="hint">API 예정: <code>POST /api/user/login</code></p>
    </section>
</main>
<footer class="site-footer">Spring Boot + Thymeleaf + PostgreSQL side project</footer>

</body>
</html>
