<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Order Detail | Portfolio Mall</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="site-header">
    <a class="brand" href="/items">Portfolio Mall</a>
    <p class="subtitle">User Order Page</p>
    <nav class="nav">
        <a href="/items">상품</a>
        <a href="/search">검색</a>
        <a href="/user/basket">장바구니</a>
        <a href="/user/orders">내 주문</a>
        <a href="/user/profile">내 정보</a>
        <a href="/user/login">유저 로그인</a>
    </nav>
    <nav class="nav nav-secondary">
        <a href="/seller/items">판매자 상품</a>
        <a href="/seller/orders">판매자 주문</a>
        <a href="/seller/profile">판매자 정보</a>
        <a href="/seller/login">판매자 로그인</a>
    </nav>
</header>
<main class="container">
    <h1>주문 상세</h1>
    <section class="card">
        <p>주문 번호: <strong th:text="${orderId}">1</strong></p>
        <dl class="description-list"><dt>주문 상태</dt><dd>CREATED</dd><dt>배송 정보</dt><dd>배송 준비 전</dd><dt>결제 금액</dt><dd>10,000원</dd></dl>
        <div class="actions">
            <button type="button">구매 확정</button>
            <button type="button" class="button-secondary">확정 기한 연장</button>
            <button type="button" class="button-danger">취소 요청</button>
            <button type="button" class="button-danger">반품 요청</button>
        </div>
        <p class="hint">API 예정: <code>POST /api/user/orders/{orderId}/confirm</code>, <code>POST /api/user/orders/{orderId}/cancel-request</code></p>
    </section>
</main>
<footer class="site-footer">Spring Boot + Thymeleaf + PostgreSQL side project</footer>
<script th:inline="javascript">
    const orderId = /*[[${orderId}]]*/ 1;
    console.log("orderId:", orderId);
</script>
</body>
</html>
