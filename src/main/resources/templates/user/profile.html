<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile | Portfolio Mall</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="site-header">
    <a class="brand" href="/items">Portfolio Mall</a>
    <p class="subtitle">User Info Page</p>
    <nav class="nav">
        <a href="/items">상품</a>
        <a href="/search">검색</a>
        <a href="/user/basket">장바구니</a>
        <a href="/user/orders">내 주문</a>
        <a href="/user/profile">내 정보</a>
        <a href="/user/login">유저 로그인</a>
    </nav>
    <nav class="nav nav-secondary">
        <a href="/seller/items">판매자 상품</a>
        <a href="/seller/orders">판매자 주문</a>
        <a href="/seller/profile">판매자 정보</a>
        <a href="/seller/login">판매자 로그인</a>
    </nav>
</header>
<main class="container">
    <h1>유저 프로필</h1>
    <section class="card">
        <form class="form" id="userProfileForm">
            <label><span>닉네임</span><input type="text" name="nickname" placeholder="닉네임"></label>
            <label><span>이메일</span><input type="email" name="email" placeholder="email@example.com"></label>
            <label><span>전화번호</span><input type="tel" name="phone" placeholder="010-0000-0000"></label>
            <button type="submit">프로필 수정</button>
        </form>
        <hr>
        <h2>주소 관리</h2>
        <form class="form">
            <label><span>새 주소</span><input type="text" name="address" placeholder="새 주소"></label>
            <button type="submit">주소 추가</button>
        </form>
        <p class="hint">API 예정: <code>PATCH /api/user/profile</code>, <code>POST /api/user/addresses</code>, <code>PATCH /api/user/default-address</code></p>
    </section>
</main>
<footer class="site-footer">Spring Boot + Thymeleaf + PostgreSQL side project</footer>

</body>
</html>
