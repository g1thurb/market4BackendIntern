<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Basket | Portfolio Mall</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="site-header">
    <a class="brand" href="/items">Portfolio Mall</a>
    <p class="subtitle">User Order Page</p>
    <nav class="nav">
        <a href="/items">상품</a>
        <a href="/search">검색</a>
        <a href="/user/basket">장바구니</a>
        <a href="/user/orders">내 주문</a>
        <a href="/user/profile">내 정보</a>
        <a href="/user/login">유저 로그인</a>
    </nav>
    <nav class="nav nav-secondary">
        <a href="/seller/items">판매자 상품</a>
        <a href="/seller/orders">판매자 주문</a>
        <a href="/seller/profile">판매자 정보</a>
        <a href="/seller/login">판매자 로그인</a>
    </nav>
</header>
<main class="container">
    <h1>장바구니</h1>
    <section class="card">
        <table class="table">
            <thead><tr><th>상품</th><th>수량</th><th>가격</th><th>관리</th></tr></thead>
            <tbody><tr><td>샘플 상품</td><td><input type="number" min="1" value="1"></td><td>10,000원</td><td><button type="button" class="button-small">삭제</button></td></tr></tbody>
        </table>
        <div class="actions actions-right"><a class="button" href="/user/orders/new?source=basket">주문하기</a></div>
        <p class="hint">API 예정: <code>GET /api/user/basket</code>, <code>PATCH /api/user/basket/items/{basketItemId}</code>, <code>DELETE /api/user/basket/items/{basketItemId}</code></p>
    </section>
</main>
<footer class="site-footer">Spring Boot + Thymeleaf + PostgreSQL side project</footer>

</body>
</html>
