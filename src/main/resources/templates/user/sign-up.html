<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Sign Up | Portfolio Mall</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="site-header">
    <a class="brand" href="/items">Portfolio Mall</a>
    <p class="subtitle">User Info Page</p>
    <nav class="nav">
        <a href="/items">상품</a>
        <a href="/search">검색</a>
        <a href="/user/basket">장바구니</a>
        <a href="/user/orders">내 주문</a>
        <a href="/user/profile">내 정보</a>
        <a href="/user/login">유저 로그인</a>
    </nav>
    <nav class="nav nav-secondary">
        <a href="/seller/items">판매자 상품</a>
        <a href="/seller/orders">판매자 주문</a>
        <a href="/seller/profile">판매자 정보</a>
        <a href="/seller/login">판매자 로그인</a>
    </nav>
</header>
<main class="container">
    <h1>유저 회원가입</h1>
    <section class="card">
        <form class="form" id="userSignUpForm">
            <label><span>아이디</span><input type="text" name="id" placeholder="아이디"></label>
            <button type="button" class="button-secondary">아이디 중복 확인</button>
            <label><span>비밀번호</span><input type="password" name="password" placeholder="비밀번호"></label>
            <label><span>비밀번호 확인</span><input type="password" name="passwordConfirm" placeholder="비밀번호 확인"></label>
            <label><span>닉네임</span><input type="text" name="nickname" placeholder="닉네임"></label>
            <button type="button" class="button-secondary">닉네임 중복 확인</button>
            <label><span>이름</span><input type="text" name="username" placeholder="이름"></label>
            <label><span>생년월일</span><input type="date" name="birthday"></label>
            <label><span>이메일</span><input type="email" name="email" placeholder="email@example.com"></label>
            <label><span>전화번호</span><input type="tel" name="phone" placeholder="010-0000-0000"></label>
            <label><span>기본 주소</span><input type="text" name="address" placeholder="주소"></label>
            <button type="submit">가입하기</button>
        </form>
        <p class="hint">API 예정: <code>GET /api/user/sign-up/check-id</code>, <code>GET /api/user/sign-up/check-nickname</code>, <code>POST /api/user/sign-up</code></p>
    </section>
</main>
<footer class="site-footer">Spring Boot + Thymeleaf + PostgreSQL side project</footer>

</body>
</html>
