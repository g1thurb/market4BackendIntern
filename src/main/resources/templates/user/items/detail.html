<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Item Detail | Portfolio Mall</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="site-header">
    <a class="brand" href="/items">Portfolio Mall</a>
    <p class="subtitle">User Item Page</p>
    <nav class="nav">
        <a href="/items">상품</a>
        <a href="/search">검색</a>
        <a href="/user/basket">장바구니</a>
        <a href="/user/orders">내 주문</a>
        <a href="/user/profile">내 정보</a>
        <a href="/user/login">유저 로그인</a>
    </nav>
    <nav class="nav nav-secondary">
        <a href="/seller/items">판매자 상품</a>
        <a href="/seller/orders">판매자 주문</a>
        <a href="/seller/profile">판매자 정보</a>
        <a href="/seller/login">판매자 로그인</a>
    </nav>
</header>
<main class="container">
    <h1>상품 상세</h1>
    <section class="card">
        <p>상품 코드: <strong th:text="${itemCode}">1</strong></p>
        <div class="detail-layout">
            <div class="image-placeholder image-large">Image</div>
            <div>
                <h2>샘플 상품명</h2>
                <p class="muted">상품 상세 설명 영역입니다.</p>
                <p class="price">10,000원</p>
                <label><span>수량</span><input type="number" min="1" value="1"></label>
                <div class="actions">
                    <button type="button">장바구니 담기</button>
                    <a class="button" href="/user/orders/new?source=item&itemCode=1&quantity=1">바로 구매</a>
                </div>
            </div>
        </div>
        <p class="hint">나중에 <code>GET /api/items/{itemCode}</code>로 상품 정보를 받아오면 됩니다.</p>
    </section>
</main>
<footer class="site-footer">Spring Boot + Thymeleaf + PostgreSQL side project</footer>
<script th:inline="javascript">
    const itemCode = /*[[${itemCode}]]*/ 1;
    console.log("itemCode:", itemCode);
</script>
</body>
</html>
