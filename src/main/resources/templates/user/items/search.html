<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search | Portfolio Mall</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="site-header">
    <a class="brand" href="/items">Portfolio Mall</a>
    <p class="subtitle">Search Page</p>
    <nav class="nav">
        <a href="/items">상품</a>
        <a href="/search">검색</a>
        <a href="/user/basket">장바구니</a>
        <a href="/user/orders">내 주문</a>
        <a href="/user/profile">내 정보</a>
        <a href="/user/login">유저 로그인</a>
    </nav>
    <nav class="nav nav-secondary">
        <a href="/seller/items">판매자 상품</a>
        <a href="/seller/orders">판매자 주문</a>
        <a href="/seller/profile">판매자 정보</a>
        <a href="/seller/login">판매자 로그인</a>
    </nav>
</header>
<main class="container">
    <h1>상품 검색</h1>
    <section class="card">
        <form class="form" method="get" action="/search">
            <label><span>검색어</span><input type="text" name="keyword" placeholder="검색어를 입력하세요"></label>
            <button type="submit">검색</button>
        </form>
        <div class="empty-state">검색 결과 영역</div>
    </section>
</main>
<footer class="site-footer">Spring Boot + Thymeleaf + PostgreSQL side project</footer>

</body>
</html>
