<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Items | Portfolio Mall</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="site-header">
    <a class="brand" href="/items">Portfolio Mall</a>
    <p class="subtitle">User Item Page</p>
    <nav class="nav">
        <a href="/items">상품</a>
        <a href="/search">검색</a>
        <a href="/user/basket">장바구니</a>
        <a href="/user/orders">내 주문</a>
        <a href="/user/profile">내 정보</a>
        <a href="/user/login">유저 로그인</a>
    </nav>
    <nav class="nav nav-secondary">
        <a href="/seller/items">판매자 상품</a>
        <a href="/seller/orders">판매자 주문</a>
        <a href="/seller/profile">판매자 정보</a>
        <a href="/seller/login">판매자 로그인</a>
    </nav>
</header>
<main class="container">
    <h1>상품 목록</h1>
    <section class="card">
        <div class="toolbar">
            <input type="text" placeholder="상품명 검색">
            <button type="button">검색</button>
        </div>
        <div class="grid">
            <article class="item-card">
                <div class="image-placeholder">Image</div>
                <h2>샘플 상품</h2>
                <p class="muted">판매자명</p>
                <p class="price">10,000원</p>
                <a class="button button-small" href="/items/1">상세 보기</a>
            </article>
        </div>
        <p class="hint">나중에 <code>GET /api/items?page=0</code> 응답으로 채우면 됩니다.</p>
    </section>
</main>
<footer class="site-footer">Spring Boot + Thymeleaf + PostgreSQL side project</footer>

</body>
</html>
