<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Sign Up | Portfolio Mall</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="site-header">
    <a class="brand" href="/items">Portfolio Mall</a>
    <p class="subtitle">Seller Info Page</p>
    <nav class="nav">
        <a href="/items">상품</a>
        <a href="/search">검색</a>
        <a href="/user/basket">장바구니</a>
        <a href="/user/orders">내 주문</a>
        <a href="/user/profile">내 정보</a>
        <a href="/user/login">유저 로그인</a>
    </nav>
    <nav class="nav nav-secondary">
        <a href="/seller/items">판매자 상품</a>
        <a href="/seller/orders">판매자 주문</a>
        <a href="/seller/profile">판매자 정보</a>
        <a href="/seller/login">판매자 로그인</a>
    </nav>
</header>
<main class="container">
    <h1>판매자 회원가입</h1>
    <section class="card">
        <form class="form" id="sellerSignUpForm">
            <label><span>아이디</span><input type="text" name="id" placeholder="아이디"></label>
            <button type="button" class="button-secondary">아이디 중복 확인</button>
            <label><span>비밀번호</span><input type="password" name="password" placeholder="비밀번호"></label>
            <label><span>비밀번호 확인</span><input type="password" name="passwordConfirm" placeholder="비밀번호 확인"></label>
            <label><span>스토어명</span><input type="text" name="storeName" placeholder="스토어명"></label>
            <button type="button" class="button-secondary">스토어명 중복 확인</button>
            <label><span>TIN</span><input type="text" name="storeTin" placeholder="TIN"></label>
            <label><span>CRN</span><input type="text" name="storeCrn" placeholder="CRN"></label>
            <label><span>BRN</span><input type="text" name="storeBrn" placeholder="BRN"></label>
            <button type="submit">가입하기</button>
        </form>
        <p class="hint">API 예정: <code>POST /api/seller/sign-up</code></p>
    </section>
</main>
<footer class="site-footer">Spring Boot + Thymeleaf + PostgreSQL side project</footer>

</body>
</html>
