<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Item Detail | Portfolio Mall</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="site-header">
    <a class="brand" href="/items">Portfolio Mall</a>
    <p class="subtitle">Seller Item Page</p>
    <nav class="nav">
        <a href="/items">상품</a>
        <a href="/search">검색</a>
        <a href="/user/basket">장바구니</a>
        <a href="/user/orders">내 주문</a>
        <a href="/user/profile">내 정보</a>
        <a href="/user/login">유저 로그인</a>
    </nav>
    <nav class="nav nav-secondary">
        <a href="/seller/items">판매자 상품</a>
        <a href="/seller/orders">판매자 주문</a>
        <a href="/seller/profile">판매자 정보</a>
        <a href="/seller/login">판매자 로그인</a>
    </nav>
</header>
<main class="container">
    <h1>판매자 상품 상세</h1>
    <section class="card">
        <p>상품 코드: <strong th:text="${itemCode}">1</strong></p>
        <form class="form" id="sellerItemUpdateForm">
            <label><span>상품명</span><input type="text" name="itemName" placeholder="상품명"></label>
            <label><span>가격</span><input type="number" name="price" min="0" placeholder="가격"></label>
            <label><span>판매 가능 수량</span><input type="number" name="available" min="0" placeholder="수량"></label>
            <button type="submit">상품 수정</button>
            <button type="button" class="button-danger">상품 비활성화</button>
        </form>
        <p class="hint">API 예정: <code>PATCH /api/seller/items/{itemCode}</code>, <code>PATCH /api/seller/items/{itemCode}/disable</code></p>
    </section>
</main>
<footer class="site-footer">Spring Boot + Thymeleaf + PostgreSQL side project</footer>
<script th:inline="javascript">
    const itemCode = /*[[${itemCode}]]*/ 1;
    console.log("seller itemCode:", itemCode);
</script>
</body>
</html>
