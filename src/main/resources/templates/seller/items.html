<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Items | Portfolio Mall</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="site-header">
    <a class="brand" href="/items">Portfolio Mall</a>
    <p class="subtitle">Seller Item Page</p>
    <nav class="nav">
        <a href="/items">상품</a>
        <a href="/search">검색</a>
        <a href="/user/basket">장바구니</a>
        <a href="/user/orders">내 주문</a>
        <a href="/user/profile">내 정보</a>
        <a href="/user/login">유저 로그인</a>
    </nav>
    <nav class="nav nav-secondary">
        <a href="/seller/items">판매자 상품</a>
        <a href="/seller/orders">판매자 주문</a>

        <a href="/seller/login">판매자 로그인</a>
    </nav>
</header>
<main class="container">
    <h1>판매자 상품 목록</h1>
    <section class="card">
        <div class="actions"><a class="button" href="/seller/items/new">상품 등록</a></div>

            <tbody><tr><td>1</td><td>샘플 상품</td><td>10,000원</td><td>판매중</td><td><a href="/seller/items/1">관리</a></td></tr></tbody>
        </table>
        <p class="hint">API 예정: <code>GET /api/seller/items?page=0</code></p>
    </section>
</main>
<footer class="site-footer">Spring Boot + Thymeleaf + PostgreSQL side project</footer>

</body>
</html>
