spring:
  application:
    name: portfolio

  datasource:
    url: jdbc:postgresql://localhost:5433/personal_db
    username: personal_user
    password: personal_password
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: validate

    show-sql: true

    properties:
      hibernate:
        format_sql: true